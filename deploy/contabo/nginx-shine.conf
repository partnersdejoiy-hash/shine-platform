# Shine on the Dejoiy Mail server. install.sh copies this to /etc/nginx/sites-available/shine
# with the host names filled in (__APP__, __API__, __SITE__).
map $http_upgrade $shine_connection { default upgrade; '' close; }

server {
  listen 80;
  listen [::]:80;
  server_name __APP__ __API__ __SITE__;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

# The app itself: static files built by install.sh/update.sh.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name __APP__;
  ssl_certificate /etc/letsencrypt/live/shine/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shine/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  # Dejoiy Mail shows Shine's chats in its chat panel; nobody else may frame it.
  add_header Content-Security-Policy "frame-ancestors 'self' https://mail.dejoiy.com https://admin-mail.dejoiy.com" always;
  add_header X-Content-Type-Options nosniff always;
  root /var/www/shine;
  index index.html;
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://mail.dejoiy.com https://admin-mail.dejoiy.com" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location / { try_files $uri $uri/ /index.html; }
}

# Convex API + realtime websocket (what the app talks to).
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name __API__;
  ssl_certificate /etc/letsencrypt/live/shine/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shine/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 100m;
  location / {
    proxy_pass http://127.0.0.1:3210;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $shine_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}

# Convex HTTP actions (sign-in keys, auth callbacks).
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name __SITE__;
  ssl_certificate /etc/letsencrypt/live/shine/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shine/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 100m;
  location / {
    proxy_pass http://127.0.0.1:3211;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
}
