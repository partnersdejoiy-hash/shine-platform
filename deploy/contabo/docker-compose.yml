# Shine's backend on the Dejoiy Mail server: self-hosted Convex (database, realtime, auth, files).
# Both ports listen on 127.0.0.1 only; nginx publishes them over HTTPS (nginx-shine.conf).
# Values come from /etc/shine/convex.env (written by install.sh).
services:
  backend:
    # shortcut: tracks :latest like Convex's own compose file; pin a tag here if an update ever misbehaves
    image: ghcr.io/convex/convex-backend:latest
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:3210:3210"
      - "127.0.0.1:3211:3211"
    volumes:
      - data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN
      - CONVEX_SITE_ORIGIN
      - INSTANCE_NAME
      - INSTANCE_SECRET
      - DISABLE_BEACON=true
      - DISABLE_METRICS_ENDPOINT=true
      - DOCUMENT_RETENTION_DELAY=172800
      - RUST_LOG=info
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  # Admin dashboard, reachable only through an SSH tunnel:  ssh -L 6791:127.0.0.1:6791 root@<server>
  dashboard:
    image: ghcr.io/convex/convex-dashboard:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:3210
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
