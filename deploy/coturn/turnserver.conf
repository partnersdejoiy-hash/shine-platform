# Coturn configuration for SHINE (self-hosted TURN/STUN, DEJOIY)
# Runs with host networking — listening addresses below.

listening-port=3478
tls-listening-port=5349
alt-listening-port=3479

# Public IP of this server (set it — critical for TURN relays)
external-ip=CHANGE_ME_PUBLIC_IP

# STUN-only mode for LAN, TURN for everyone else
fingerprint
lt-cred-mech

# Static long-term credential used by the web app for relay candidates.
# These MUST match TURN_USERNAME / TURN_PASSWORD in the project Keys tab so
# the meeting client can authenticate to Coturn.
user=dejoiy-turn:CHANGE_ME_TURN_PASSWORD
realm=meet.dejoiy.com

# NOTE: use-auth-secret / static-auth-secret are intentionally NOT enabled.
# Coturn warns that lt-cred-mech and use-auth-secret cannot be mixed — the
# shared-secret mode overrides the static user and every TURN allocation is
# rejected with 403. The web app authenticates with the static user below, so
# keep this file on lt-cred-mech only.

# Allow clients to obtain relay candidates
no-multicast-peers

# Minimal, safe defaults
stale-nonce=600
max-bps=0
total-quota=1200
max-allocate-lifetime=3600

# Logging
log-file=/var/log/turnserver.log
simple-log
