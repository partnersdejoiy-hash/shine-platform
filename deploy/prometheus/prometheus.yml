global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3001"]

  - job_name: "livekit"
    static_configs:
      - targets: ["livekit:7880"]

  - job_name: "livekit-egress"
    static_configs:
      - targets: ["livekit-egress:7882"]

  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]   # profile: ops

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]  # profile: ops

  - job_name: "promtail"
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9102"]  # profile: ops (host metrics)

  - job_name: "meilisearch"
    static_configs:
      - targets: ["meilisearch:7700"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]  # profile: observability
