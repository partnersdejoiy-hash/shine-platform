# SHINE SPA server (default vhost).
# Serves the built Vite bundle with a full SPA fallback to index.html.
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    # Legacy upstream ports referenced by the old compose vhost files —
    # keep them alive so /api proxy rules that point at web:3000 / web:5173
    # still find this container on the compose network.
    listen       3000;
    listen       5173;

    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long-lived asset caching (hashed filenames) — never stale.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}