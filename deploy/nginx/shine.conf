# SHINE public vhost — routes everything to the self-hosted services.
# TLS: place your certificates in deploy/nginx/certs (shine.dejoiy.com.crt/.key)
# or use certbot with --webroot; the config below expects certs when enabled.

# ---- HTTP -> HTTPS redirect ------------------------------------------------
server {
    listen 80;
    server_name shine.dejoiy.com;

    # ACME challenge (certbot)
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS server ----------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name shine.dejoiy.com;

    # ssl_certificate     /etc/nginx/certs/shine.dejoiy.com.crt;
    # ssl_certificate_key /etc/nginx/certs/shine.dejoiy.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # ---- Frontend (Next.js, Phase B) --------------------------------------
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API (NestJS) ------------------------------------------------------
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 1g;   # uploads (proxy to MinIO presigned URLs)
    }

    # ---- Socket.IO (realtime) ----------------------------------------------
    location /socket.io/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- LiveKit signaling (WS) --------------------------------------------
    location /livekit/ {
        proxy_pass http://livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # ---- MinIO API + console ------------------------------------------------
    location /minio/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 5g;
        # presigned URL rewrite (MinIO expects path-style buckets)
        rewrite ^/minio/(.*) /$1 break;
    }

    location /minio-console/ {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Meilisearch ---------------------------------------------------------
    location /search/ {
        proxy_pass http://meilisearch:7700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Novu (notifications UI + API) ----------------------------------------
    location /notifications/ {
        proxy_pass http://novu:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Grafana (ops only) -----------------------------------------------------
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Prometheus (ops only) ----------------------------------------------------
    location /prometheus/ {
        proxy_pass http://prometheus:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
