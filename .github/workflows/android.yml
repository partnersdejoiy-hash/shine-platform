# Builds the SHINE Android app and puts it in a GitHub Release.
# Run it from GitHub: Actions > SHINE Android app > Run workflow, with the next version code.
# Each run makes the release android-v<version code> with shine-<version>.apk (install on a phone
# straight away) and shine-<version>.aab (for Google Play), and their SHA-256 in the notes.
# Everything is signed with the upload key from the repository secrets (android/README.md, steps 1
# and 2). Without those secrets the run stops: an unsigned APK cannot be installed.
name: SHINE Android app
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (a whole number, one higher than the last release)"
        required: true
        default: "1"
      version_name:
        description: "Version name, like 1.0.0"
        required: true
        default: "1.0.0"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHINE_VERSION_CODE: ${{ inputs.version_code }}
      SHINE_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Upload key and version
        env:
          KEYSTORE_BASE64: ${{ secrets.SHINE_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHINE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the upload key secrets first (android/README.md, steps 1 and 2)"
            exit 1
          fi
          if ! [[ "$SHINE_VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]]; then echo "::error::Version code must be a whole number like 2."; exit 1; fi
          if ! [[ "$SHINE_VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z.-]{0,29}$ ]]; then echo "::error::Version name must look like 1.0.0."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "SHINE_KEYSTORE=$RUNNER_TEMP/upload.jks"
            echo "SHINE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SHINE_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SHINE_KEY_ALIAS=shine"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - name: Build bundle and APK
        working-directory: android/shine
        run: chmod +x gradlew && ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Check the signature and name the files
        run: |
          out="android/shine/app/build/outputs"
          apk="$out/apk/release/app-release.apk"; aab="$out/bundle/release/app-release.aab"
          # Gradle names an unsigned APK app-release-unsigned.apk: never release one
          if [ ! -f "$apk" ] || [ ! -f "$aab" ]; then echo "::error::No signed APK or bundle was built."; ls -R "$out"; exit 1; fi
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$signer" ]; then "$signer" verify --print-certs "$apk"; fi   # fails the run if the APK is not signed
          mkdir -p release
          cp "$apk" "release/shine-$SHINE_VERSION_NAME.apk"
          cp "$aab" "release/shine-$SHINE_VERSION_NAME.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: shine-${{ inputs.version_code }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create the release, with GitHub's own token
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: release, merge-multiple: true}
      - name: Release with the APK and the bundle
        run: |
          cd release
          ls -l
          [ "$(ls | wc -l)" = 2 ] || { echo "::error::Expected 2 files (APK and AAB)."; exit 1; }
          tag="android-v$VERSION_CODE"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Run again with a higher version code."; exit 1
          fi
          {
            echo "SHINE for Android, version $VERSION_NAME (version code $VERSION_CODE)."
            echo
            echo "To install on a phone, download the .apk (see android/README.md, \"Install the APK without Play Store\"). The .aab is for Google Play."
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            for f in *; do echo "| \`$f\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
          } > ../notes.md
          gh release create "$tag" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SHINE Android $VERSION_NAME" --notes-file ../notes.md
