<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F5F5F0" media="(prefers-color-scheme: light)" />
  <script>
    // Apply system theme BEFORE first paint to prevent flash
    (function() {
      try {
        var saved = localStorage.getItem('shine-theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.classList.toggle('dark', saved !== 'light');
          return;
        }
      } catch(e) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', prefersDark);
    })();
  </script>
  <meta name="description" content="SHINE · Powered by DEJOIY — enterprise messaging, calls, HD meetings, tasks, files and AI in one premium workspace." />
  <title>SHINE — Powered by DEJOIY</title>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
